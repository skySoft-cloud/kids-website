    <circle cx="248" cy="230" r="23" fill="#F7E3CB"/>
    <circle cx="228" cy="222" r="9" fill="#6B4A36"/>
    <circle cx="268" cy="222" r="9" fill="#6B4A36"/>
    <path d="M228 230 q-8 14 0 20 M268 230 q8 14 0 20" stroke="#6B4A36" stroke-width="6" fill="none" stroke-linecap="round"/>
